<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head}">
<title>Resume Builder</title>
<style>
.section-card {
	margin-bottom: 20px;
}

.add-btn {
	margin-bottom: 15px;
}

.remove-btn {
	margin-top: 10px;
}

.section-container {
	margin-bottom: 15px;
}

.hidden {
	display: none;
}

.form-label {
	font-weight: 500;
}

.card-header {
	font-weight: 600;
}
</style>
</head>
<body>
	<div th:replace="~{base :: nav}"></div>

	<div class="container mt-4">
		<h2 class="mb-4">Resume Builder</h2>

		<form th:action="@{/resume/generate}" method="post"
			th:object="${user}">
			<!-- Personal Information Section -->
			<div class="card section-card">
				<div class="card-header bg-primary text-white">
					<h5>Personal Information</h5>
				</div>
				<div class="card-body">
					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label">Full Name*</label> <input type="text"
								class="form-control" th:field="*{name}" required>
						</div>
						<div class="col-md-6 mb-3">
							<label class="form-label">Email*</label> <input type="email"
								class="form-control" th:field="*{email}" required>
						</div>
					</div>
					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label">Phone*</label> <input type="tel"
								class="form-control" th:field="*{phone}" required>
						</div>
						<div class="col-md-6 mb-3">
							<label class="form-label">LinkedIn Profile</label> <input
								type="url" class="form-control" th:field="*{linkedin}">
						</div>
					</div>
					<div class="mb-3">
						<label class="form-label">About You</label>
						<textarea class="form-control" th:field="*{about}" rows="3"></textarea>
					</div>

					<!-- Address -->
					<div class="card mt-3">
						<div class="card-header bg-light">
							<h6>Address</h6>
						</div>
						<div class="card-body">
							<div class="row">
								<div class="col-md-8 mb-3">
									<label class="form-label">Street</label> <input type="text"
										class="form-control" th:field="*{address.street}">
								</div>
								<div class="col-md-4 mb-3">
									<label class="form-label">City</label> <input type="text"
										class="form-control" th:field="*{address.city}">
								</div>
								<div class="col-md-4 mb-3">
									<label class="form-label">State</label> <input type="text"
										class="form-control" th:field="*{address.state}">
								</div>
								<div class="col-md-4 mb-3">
									<label class="form-label">ZipCode</label> <input type="number"
										class="form-control" th:field="*{address.zipCode}">
								</div>
								<div class="col-md-4 mb-3">
									<label class="form-label">Country</label> <input type="text"
										class="form-control" th:field="*{address.country}">
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Education Section -->
			<div class="card section-card">
				<div
					class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
					<h5>Education</h5>
					<button type="button" id="add-education"
						class="btn btn-sm btn-light">
						<i class="fas fa-plus"></i> Add Education
					</button>
				</div>
				<div class="card-body education-section">
					<div class="section-container" th:each="edu, iter : *{education}">
						<div class="card mb-3">
							<div class="card-body">
								<div class="row">
									<div class="col-md-6 mb-3">
										<label class="form-label">Degree*</label> <input type="text"
											class="form-control"
											th:field="*{education[__${iter.index}__].degree}" required>
									</div>
									<div class="col-md-6 mb-3">
										<label class="form-label">Institution*</label> <input
											type="text" class="form-control"
											th:field="*{education[__${iter.index}__].institution}"
											required>
									</div>
								</div>
								<div class="row">
									<div class="col-md-4 mb-3">
										<label class="form-label">Start Date*</label> <input
											type="text" class="form-control"
											th:field="*{education[__${iter.index}__].date.startDate}"
											placeholder="YYYY" required>
									</div>
									<div class="col-md-4 mb-3">
										<label class="form-label">End Date (or expected)</label> <input
											type="text" class="form-control"
											th:field="*{education[__${iter.index}__].date.endDate}"
											placeholder="YYYY">
									</div>
									<div class="col-md-4 mb-3">
										<label class="form-label">Grade/GPA</label> <input type="text"
											class="form-control"
											th:field="*{education[__${iter.index}__].grade}">
									</div>
								</div>
								<button type="button" class="btn btn-sm btn-danger remove-btn"
									th:classappend="${iter.index == 0} ? 'hidden' : ''">
									<i class="fas fa-trash"></i> Remove
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Experience Section -->
			<div class="card section-card">
				<div
					class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
					<h5>Work Experience</h5>
					<button type="button" id="add-experience"
						class="btn btn-sm btn-light">
						<i class="fas fa-plus"></i> Add Experience
					</button>
				</div>
				<div class="card-body experience-section">
					<div class="section-container" th:each="exp, iter : *{experience}">
						<div class="card mb-3">
							<div class="card-body">
								<div class="row">
									<div class="col-md-6 mb-3">
										<label class="form-label">Job Title*</label> <input
											type="text" class="form-control"
											th:field="*{experience[__${iter.index}__].position}" required>
									</div>
									<div class="col-md-6 mb-3">
										<label class="form-label">Company*</label> <input type="text"
											class="form-control"
											th:field="*{experience[__${iter.index}__].company}" required>
									</div>
								</div>
								<div class="row">
									<div class="col-md-4 mb-3">
										<label class="form-label">Start Date*</label> <input
											type="text" class="form-control"
											th:field="*{experience[__${iter.index}__].date.startDate}"
											placeholder="MM/YYYY" required>
									</div>
									<div class="col-md-4 mb-3">
										<label class="form-label">End Date</label> <input type="text"
											class="form-control"
											th:field="*{experience[__${iter.index}__].date.endDate}"
											placeholder="MM/YYYY">
									</div>
									<div class="col-md-4 mb-3">
										<label class="form-label">Employment Type</label> <select
											class="form-select"
											th:field="*{experience[__${iter.index}__].jobMode}">
											<option value="Full-time">Full-time</option>
											<option value="Part-time">Part-time</option>
											<option value="Contract">Contract</option>
											<option value="Internship">Internship</option>
										</select>
									</div>
								</div>
								<div class="mb-3">
									<label class="form-label">Description</label>
									<textarea class="form-control"
										th:field="*{experience[__${iter.index}__].description}"
										rows="3"></textarea>
								</div>
								<button type="button" class="btn btn-sm btn-danger remove-btn"
									th:classappend="${iter.index == 0} ? 'hidden' : ''">
									<i class="fas fa-trash"></i> Remove
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Projects Section -->
			<div class="card section-card">
				<div
					class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
					<h5>Projects</h5>
					<button type="button" id="add-project" class="btn btn-sm btn-light">
						<i class="fas fa-plus"></i> Add Project
					</button>
				</div>
				<div class="card-body projects-section">
					<div class="section-container" th:each="proj, iter : *{projects}">
						<div class="card mb-3">
							<div class="card-body">
								<div class="row">
									<div class="col-md-8 mb-3">
										<label class="form-label">Project Title*</label> <input
											type="text" class="form-control"
											th:field="*{projects[__${iter.index}__].title}" required>
									</div>
									<div class="col-md-4 mb-3">
										<label class="form-label">Project URL</label> <input
											type="url" class="form-control"
											th:field="*{projects[__${iter.index}__].url}">
									</div>
								</div>
								<div class="row">
									<div class="col-md-6 mb-3">
										<label class="form-label">Start Date</label> <input
											type="text" class="form-control"
											th:field="*{projects[__${iter.index}__].date.startDate}"
											placeholder="MM/YYYY">
									</div>
									<div class="col-md-6 mb-3">
										<label class="form-label">End Date</label> <input type="text"
											class="form-control"
											th:field="*{projects[__${iter.index}__].date.endDate}"
											placeholder="MM/YYYY">
									</div>
								</div>
								<div class="mb-3">
									<label class="form-label">Description*</label>
									<textarea class="form-control"
										th:field="*{projects[__${iter.index}__].description}" rows="3"
										required></textarea>
								</div>
								<button type="button" class="btn btn-sm btn-danger remove-btn"
									th:classappend="${iter.index == 0} ? 'hidden' : ''">
									<i class="fas fa-trash"></i> Remove
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Skills Section -->
			<div class="card section-card">
				<div class="card-header bg-primary text-white">
					<h5>Skills</h5>
				</div>
				<div class="card-body">
					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label">Programming Languages</label> <input
								type="text" class="form-control" th:field="*{skill.languages}"
								placeholder="Java, Python, JavaScript">
						</div>
						<div class="col-md-6 mb-3">
							<label class="form-label">Frameworks & Libraries</label> <input
								type="text" class="form-control" th:field="*{skill.frameworks}"
								placeholder="Spring Boot, React, Django">
						</div>
					</div>
					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label">Developer Tools</label> <input
								type="text" class="form-control" th:field="*{skill.tools}"
								placeholder="Git, Docker, VS Code">
						</div>
						<div class="col-md-6 mb-3">
							<label class="form-label">Technologies</label> <input type="text"
								class="form-control" th:field="*{skill.technologies}"
								placeholder="AWS, MySQL, REST APIs">
						</div>
					</div>
				</div>
			</div>

			<!-- Template Selection -->
			<div class="card section-card">
				<div class="card-header bg-primary text-white">
					<h5>Template Selection</h5>
				</div>
				<div class="card-body">
					<div class="mb-3">
						<label class="form-label">Choose a Template</label> <select
							class="form-select" name="template" required>
							<option value="">-- Select Template --</option>
							<option value="TemplateA">Creative</option>
							<option value="TemplateB">Modern</option>
							<option value="TemplateC">Professional</option>
						</select>
					</div>
				</div>
			</div>

			<!-- Form Actions -->
			<div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4 mb-2">
				<button type="reset" class="btn btn-secondary me-md-2">Reset
					Form</button>
				<button type="submit" class="btn btn-primary">Generate
					Resume</button>
			</div>
		</form>
	</div>

	<!-- JavaScript for dynamic sections -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://kit.fontawesome.com/a076d05399.js"
		crossorigin="anonymous"></script>
	<script>
    $(document).ready(function() {
    console.log("Document ready"); // Debug log
    
    // Initialize all sections
    initAllSections();
    
    // Event delegation for all add buttons
    $(document).on('click', '#add-education', function() { 
        console.log("Add education clicked");
        addSection('education'); 
    });
    
    $(document).on('click', '#add-experience', function() { 
        console.log("Add experience clicked");
        addSection('experience'); 
    });
    
    $(document).on('click', '#add-project', function() { 
        console.log("Add project clicked");
        addSection('projects'); 
    });
    
    // Remove button handler (event delegation)
    $(document).on('click', '.remove-btn', function() {
        console.log("Remove button clicked");
        const sectionContainer = $(this).closest('.section-container');
        const parentContainer = sectionContainer.parent();
        
        if (parentContainer.children('.section-container').length > 1) {
            sectionContainer.remove();
            updateIndexes(parentContainer);
        }
    });
});

function initAllSections() {
    // Ensure each section has at least one item
    ['education', 'experience', 'projects'].forEach(section => {
        const container = $(`.${section}-section`);
        if (container.find('.section-container').length === 0) {
            console.log(`Initializing ${section} section`);
            addSection(section);
        }
    });
}

function addSection(sectionName) {
    console.log(`Adding ${sectionName} section`);
    
    const container = $(`.${sectionName}-section`);
    const prototype = container.find('.section-container').first();
    console.log(container);
    
    if (prototype.length === 0) {
        console.error(`No prototype found for ${sectionName} section`);
        return;
    }
    
    const newIndex = container.find('.section-container').length;
    const newItem = prototype.clone(true);
    
    console.log(`New index: ${newIndex}`);
    
    // Clear values
    newItem.find('input').val('');
    newItem.find('textarea').val('');
    newItem.find('select').prop('selectedIndex', 0);
    
    // Update field names
    newItem.find('[th\\:field]').each(function() {
        const currentField = $(this).attr('th:field');
        const newField = currentField.replace(/\[\d+\]/, `[${newIndex}]`);
        $(this).attr('th:field', newField);
        console.log(`Updated field: ${currentField} -> ${newField}`);
    });
    
    // Update IDs
    newItem.find('[id]').each(function() {
        const currentId = $(this).attr('id');
        if (currentId && currentId.match(/\d+/)) {
            const newId = currentId.replace(/\d+/, newIndex);
            $(this).attr('id', newId);
            console.log(`Updated ID: ${currentId} -> ${newId}`);
        }
    });
    
    // Show remove button
    newItem.find('.remove-btn').removeClass('hidden');
    
    container.append(newItem);
    console.log(`Added new ${sectionName} section`);
}

function updateIndexes(container) {
    console.log("Updating indexes");
    container.find('.section-container').each(function(index) {
        $(this).find('[th\\:field]').each(function() {
            const currentField = $(this).attr('th:field');
            const newField = currentField.replace(/\[\d+\]/, `[${index}]`);
            $(this).attr('th:field', newField);
        });
        
        $(this).find('[id]').each(function() {
            const currentId = $(this).attr('id');
            if (currentId && currentId.match(/\d+/)) {
                const newId = currentId.replace(/\d+/, index);
                $(this).attr('id', newId);
            }
        });
    });
}
    </script>
</body>
</html>
